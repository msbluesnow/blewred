[package]
name = "blewred"
version = "0.5.0-alpha.1"
description = "blewred — preemptive live stream protection suite"
authors = ["msbluesnow"]
license = "Apache-2.0"
repository = "https://github.com/msbluesnow/blewred"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blewred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
regex = "1.10"
unicode-normalization = "0.1"
sha2 = "0.10"
base64 = "0.22"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
] }
image = "0.25.6"
ort = { version = "2.0.0-rc.13", features = ["directml"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }


